name: update-data
on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC) — GitHub may delay a few minutes
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ThaiWater + Open-Meteo -> data.json
        run: python3 scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "seal-the-flood-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
